<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secure Habitly authentication flow">
  <meta name="theme-color" content="#7627e8">
  <meta name="description" content="Sign in to Habitly — your personal habit tracker.">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <title>Habitly — Authentication</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="auth-shell" id="app">
    <section class="visual-panel" aria-label="Habitly introduction">
      <div class="visual-overlay">
        <div class="brand" aria-label="Habitly">
          <img src="assets/habitly-logo.png" alt="Habitly" class="brand-logo">
          <span class="brand-name">Habitly</span>
        </div>
        <div class="visual-copy">
          <p>PERSONAL HABIT TRACKER</p>
          <h2>Build habits.<br><span>Change life.</span></h2>
          <span>Small habits today create meaningful<br>changes tomorrow.</span>
        </div>
      </div>
    </section>

    <section class="form-panel" aria-label="Authentication">
      <div class="form-wrap" id="view" tabindex="-1"></div>
    </section>
  </main>

  <div class="sr-only" id="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="app.js"></script>
</body>

</html>
