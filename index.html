<!doctype html>
<html lang="en">

<head>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/Fav Icon Habitly.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth-gate.css">
  <meta name="description" content="Habitly — build better habits, track goals and keep your progress in one place.">
  <title>Habitly</title>
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Habitly by PRK — Personal Habit Tracker">
  <meta property="og:description" content="Build better days, one habit at a time with Habitly.">
  <meta property="og:url" content="https://habitlybyprem.netlify.app/">
  <meta property="og:site_name" content="Habitly by PRK">
  <meta property="og:image" content="https://habitlybyprem.netlify.app/og-image.png">
  <meta property="og:image:secure_url" content="https://habitlybyprem.netlify.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Habitly by PRK — Personal Habit Tracker">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Habitly by PRK — Personal Habit Tracker">
  <meta name="twitter:description" content="Build better days, one habit at a time with Habitly.">
  <meta name="twitter:image" content="https://habitlybyprem.netlify.app/og-image.png">
  <meta name="twitter:image:alt" content="Habitly by PRK — Personal Habit Tracker">
</head>

<body>
  <div id="auth-gate" aria-label="Habitly authentication">
    <iframe src="auth/index.html#login" title="Habitly Login" loading="eager"></iframe>
  </div>
  <div id="app" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth-gate.js"></script>
  <script src="app.js"></script>
</body>

</html>
