<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#08090b" />
<title>Habitly Admin</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-shell">
  <header class="admin-brand" aria-label="Habitly Admin">
    <img src="assets/Habitly Leaf Transparent.png" alt="Habitly" />
    <div class="brand-copy">
      <strong>HABITLY</strong>
      <small>ADMIN CONSOLE</small>
    </div>
  </header>

  <main>
    <section class="admin-card login-card" id="loginCard">
      <div class="admin-icon" aria-hidden="true">🔐</div>
      <p class="eyebrow">PRIVATE AREA</p>
      <h1>Admin Login</h1>
      <p class="muted">Sign in with the authorized Habitly administrator account.</p>
      <form id="loginForm" novalidate>
        <label for="adminEmail">Email
          <input id="adminEmail" type="email" autocomplete="username" value="prem.cybersecurity@gmail.com" required placeholder="Admin email" />
        </label>
        <label for="adminPassword">Password
          <input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Password" />
        </label>
        <button class="primary" type="submit">Sign In <span aria-hidden="true">→</span></button>
        <p class="error" id="loginError" role="alert"></p>
      </form>
    </section>

    <section class="admin-card dashboard-card hidden" id="dashboardCard">
      <div class="dashboard-head">
        <div>
          <p class="eyebrow">PRIVATE DASHBOARD</p>
          <h1>Visitor Records</h1>
          <p class="muted">Authenticated Habitly visitors recorded by the application.</p>
        </div>
        <button class="secondary" id="logoutBtn" type="button">Sign Out</button>
      </div>
      <div class="metrics">
        <div><span id="visitorCount">0</span><small>Total Visitors</small></div>
        <div><span id="lastJoined">—</span><small>Latest Visitor</small></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last Seen</th><th>Visits</th></tr></thead>
          <tbody id="visitorTableBody"></tbody>
        </table>
      </div>
      <p class="empty" id="emptyVisitors">No visitor records yet.</p>
      <p class="error dashboard-error" id="dashboardError" role="alert"></p>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
